<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Fuel Logistics Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b1120; color: #e2e8f0; font-family: monospace; }
  </style>
</head>
<body class="p-6 flex flex-col items-center justify-center min-h-screen">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
      <span class="text-amber-400 font-bold text-xs uppercase tracking-wider">⚡ E-Fuel Dispatch Engine</span>
      <span class="text-emerald-400 text-xs">● Connected</span>
    </div>

    <div class="space-y-4 text-xs">
      <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
        <div class="text-slate-400 mb-1">Geodesic Location:</div>
        <div class="text-teal-300 font-semibold">22.5726° N, 88.3639° E (Kolkata Sector V)</div>
      </div>

      <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
        <div class="text-slate-400 mb-1">Nearest Depots (Haversine &lt; 5km):</div>
        <div class="text-slate-200 mt-1">1. HPCL Auto Care — 1.8 km (ETA: 8 min)</div>
        <div class="text-slate-200">2. Indian Oil Highway Hub — 3.4 km (ETA: 14 min)</div>
      </div>

      <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
        <div class="text-slate-400 mb-1">PESO Safety Gate:</div>
        <div class="text-emerald-400 font-semibold">✓ Petroleum Act Container Compliance Verified</div>
      </div>

      <button onclick="alert('Dispatch sequence initiated. 4-Digit Handshake PIN: 4892')" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition text-xs">
        Initiate Emergency Dispatch
      </button>
    </div>
  </div>
</body>
</html>
